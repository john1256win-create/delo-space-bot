# docker-compose.yml — 1C Info Bot для Delo Space
# Использование:
#   export DOMAIN=bot.example.com
#   docker compose up -d --build
#   # затем Nginx + certbot (см. install.sh)

services:
  bot:
    build: .
    container_name: 1c-info-bot
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Порт извне внутрь контейнера НЕ публикуем на хост — Nginx проксирует.
      # Доступ только через Docker-сеть / localhost-прокси.
      - TZ=Europe/Moscow
    volumes:
      - ./../output:/app/output
      - ./../data:/app/data
    # НЕ открываем порт на хост напрямую (только Nginx). Для отладки — раскомментировать:
    # ports:
    #   - "8000:8000"
    networks:
      - botnet

# Nginx-контейнер — терминатор HTTPS, прокси на бота
  nginx:
    image: nginx:1.27-alpine
    container_name: 1c-info-bot-nginx
    restart: unless-stopped
    depends_on:
      - bot
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''
    networks:
      - botnet

# certbot — автоматический выпуск/обновление Let's Encrypt
  certbot:
    image: certbot/certbot
    container_name: 1c-info-bot-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do
        certbot renew --webroot -w /var/www/certbot --quiet
        sleep 12h & wait $${!}; done"

networks:
  botnet:
    driver: bridge