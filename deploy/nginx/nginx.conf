# nginx.conf — терминатор HTTPS для 1C Info Bot
# Замените bot.example.com на реальный домен.

# --- HTTP: перенаправление на HTTPS + ACME-challenge для certbot ---
server {
    listen 80;
    server_name bot.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: прокси на контейнер бота ---
server {
    listen 443 ssl;
    http2 on;
    server_name bot.example.com;

    ssl_certificate     /etc/letsencrypt/live/bot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # webhook BotX — главный эндпоинт приёма команд
    location /command {
        proxy_pass http://bot:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # статус/диагностика
    location /status {
        proxy_pass http://bot:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # callback от BotX для асинхронных операций
    location /notification/callback {
        proxy_pass http://bot:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # корень — заглушка (не открывать лишнего)
    location / {
        return 404;
    }
}